name: Organize inbox

on:
  schedule:
    # 毎日 18:00 UTC = 3:00 JST
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

# 前回実行やモバイルからのpushと重ならないよう並行実行を防止
concurrency:
  group: organize-inbox
  cancel-in-progress: false

jobs:
  organize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # ノートの作成日時をgit履歴から取得するため

      - name: 未回収のbot-conflict退避ブランチがないか確認
        run: |
          # 前回実行がmainへのpushに失敗し bot-conflict-* へ退避したまま放置されていると、
          # 今回もinboxの同じクリップを再処理してLLM呼び出しが重複する。
          # 未回収の退避ブランチがある限り新規実行を止め、先にPRとして回収してもらう。
          leftover=$(git ls-remote --heads origin 'bot-conflict-*')
          if [ -n "$leftover" ]; then
            echo "::error::未回収の bot-conflict-* ブランチが残っています。先にPRとしてマージ/クローズしてください:"
            echo "$leftover"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run organizer
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_MODEL_CHAIN: ${{ vars.LLM_MODEL_CHAIN }}
          LLM_SLEEP_SECONDS: ${{ vars.LLM_SLEEP_SECONDS }}
          MAX_ITEMS_PER_RUN: ${{ vars.MAX_ITEMS_PER_RUN }}
        run: python scripts/organize.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "organize: inbox整理 ($(date -u +%Y-%m-%d))"
          # モバイル(obsidian-git)のpushと競合したらrebaseして再試行
          for wait in 2 4 8 16 0; do
            if git push origin main; then
              exit 0
            fi
            [ "$wait" = "0" ] && break
            sleep "$wait"
            # directoryRenames=false: 大量ファイルのInbox->library移動と、モバイルが
            # 同時にInbox/へ追加した新規クリップとが、gitの「ディレクトリリネーム推測」で
            # 曖昧な衝突として扱われるのを防ぐ(新規ファイルはInbox/に留まるのが正)
            if ! git -c merge.directoryRenames=false pull --rebase origin main; then
              # rebaseがコンフリクトした場合、このまま続けても直らないので中断する
              git rebase --abort
              break
            fi
          done
          # 通常経路で着地できなかった場合、成果(新規ノート・inbox削除等)を失わないよう
          # 退避ブランチへpushする。次回実行はこのブランチが残っている限り即失敗するので
          # (前段の確認ステップ)、必ずPRとして回収すること。
          branch="bot-conflict-${GITHUB_RUN_ID}"
          echo "::error::main へのpushに失敗したため ${branch} へ退避しました。PRとして回収してください"
          git push origin "HEAD:refs/heads/${branch}"
          exit 1

      - name: tsundoku-siteの再ビルドを起動
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          # コンテンツ変更ゼロの日でも常に送る(前日分の既読トグルを次のビルドで焼き込むため)。
          # 前段の "Commit and push" が失敗した場合はこのステップに到達しない
          # (= mainの更新に失敗した実行ではdispatchしない)。
          gh api repos/mrkxlia/tsundoku-site/dispatches -f event_type=content-updated
