name: Organize inbox

on:
  schedule:
    # 毎日 18:00 UTC = 3:00 JST
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

# 前回実行やモバイルからのpushと重ならないよう並行実行を防止
concurrency:
  group: organize-inbox
  cancel-in-progress: false

jobs:
  organize:
    runs-on: ubuntu-latest
    timeout-minutes: 90 # 実測最大31分(sleepが支配的)の約3倍。デフォルト360分のハング課金事故を防止
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # ノートの作成日時をgit履歴から取得するため

      - name: 未回収のbot-conflict退避ブランチがないか確認
        run: |
          # 前回実行がmainへのpushに失敗し bot-conflict-* へ退避したまま放置されていると、
          # 今回もinboxの同じクリップを再処理してLLM呼び出しが重複する。
          # 未回収の退避ブランチがある限り新規実行を止め、先にPRとして回収してもらう。
          leftover=$(git ls-remote --heads origin 'bot-conflict-*')
          if [ -n "$leftover" ]; then
            echo "::error::未回収の bot-conflict-* ブランチが残っています。先にPRとしてマージ/クローズしてください:"
            echo "$leftover"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: tsundoku-site の vault-assets/ をcheckout(スライド等バイナリアセットの集約先)
        uses: actions/checkout@v4
        with:
          repository: mrkxlia/tsundoku-site
          token: ${{ secrets.SITE_CONTENT_TOKEN }}
          sparse-checkout: |
            vault-assets
          path: site-assets-checkout

      - name: vault-assets/ を assets/ へ同期(既存アセットの解決・fetch_slidesの冪等判定に必要)
        run: |
          mkdir -p assets
          rsync -a --exclude 'README.md' site-assets-checkout/vault-assets/ assets/

      - name: Run organizer
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_MODEL_CHAIN: ${{ vars.LLM_MODEL_CHAIN }}
          LLM_SLEEP_SECONDS: ${{ vars.LLM_SLEEP_SECONDS }}
          MAX_ITEMS_PER_RUN: ${{ vars.MAX_ITEMS_PER_RUN }}
        run: python scripts/organize.py

      - name: スライド実体の取得漏れをリカバリ(前回失敗分の再挑戦+バックフィルの日次消化)
        run: python scripts/fetch_slides.py --max-items "${MAX_SLIDES_PER_RUN:-3}"
        env:
          MAX_SLIDES_PER_RUN: ${{ vars.MAX_SLIDES_PER_RUN }}

      - name: 新規アセットをtsundoku-siteへcommit・push
        # vaultノートのcommitより先にこちらを成功させる(順序が重要)。逆順だと、
        # vault側だけ「## スライド」セクション付きでcommitされた直後にこちらが失敗した場合、
        # 参照先の実体が存在しないままvaultにcommitされてしまい、次回実行時は本文に
        # セクションが既にある(=fetch_slides.pyの処理済み判定)ため二度と自動回収されない。
        # 先にアセットを公開し、それに成功した場合のみvault側をcommitすることで、
        # 「vaultのノートが存在しないアセットを参照する」状態を作らないようにする。
        id: push_site_assets
        working-directory: site-assets-checkout
        # 認証情報は前段のcheckoutステップ(token: secrets.SITE_CONTENT_TOKEN)が
        # このディレクトリのgit configに設定済みのため、通常のgit push/pullがそのまま使う。
        run: |
          rsync -a --ignore-existing ../assets/ vault-assets/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- vault-assets/
          if git diff --cached --quiet; then
            echo "新規アセットなし"
            exit 0
          fi
          git commit -m "assets: 新規スライド/画像アセットを追加 ($(date -u +%Y-%m-%d))"
          for wait in 2 4 8 0; do
            if git push origin main; then
              exit 0
            fi
            [ "$wait" = "0" ] && break
            sleep "$wait"
            if ! git pull --rebase origin main; then
              git rebase --abort
              break
            fi
          done
          echo "::error::tsundoku-site の vault-assets/ へのpushに失敗しました。今回のvault側commitは中断します(次回実行で再試行されます)"
          exit 1

      - name: Commit and push
        id: commit_and_push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':!site-assets-checkout' ':!assets'
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "organize: inbox整理 ($(date -u +%Y-%m-%d))"
          # モバイル(obsidian-git)のpushと競合したらrebaseして再試行
          for wait in 2 4 8 16 0; do
            if git push origin main; then
              exit 0
            fi
            [ "$wait" = "0" ] && break
            sleep "$wait"
            # directoryRenames=false: 大量ファイルのInbox->library移動と、モバイルが
            # 同時にInbox/へ追加した新規クリップとが、gitの「ディレクトリリネーム推測」で
            # 曖昧な衝突として扱われるのを防ぐ(新規ファイルはInbox/に留まるのが正)
            if ! git -c merge.directoryRenames=false pull --rebase origin main; then
              # rebaseがコンフリクトした場合、このまま続けても直らないので中断する
              git rebase --abort
              break
            fi
          done
          # 通常経路で着地できなかった場合、成果(新規ノート・inbox削除等)を失わないよう
          # 退避ブランチへpushする。次回実行はこのブランチが残っている限り即失敗するので
          # (前段の確認ステップ)、必ずPRとして回収すること。
          branch="bot-conflict-${GITHUB_RUN_ID}"
          echo "::error::main へのpushに失敗したため ${branch} へ退避しました。PRとして回収してください"
          git push origin "HEAD:refs/heads/${branch}"
          exit 1

      - name: 前回の埋め込みindexをダウンロード(Releaseアセット、初回は無くて良い)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p index
          gh release download embeddings-index \
            --repo mrkxlia/tsundoku \
            --pattern embeddings.json \
            --dir index \
            --clobber \
            || echo "embeddings-index リリースが見つかりません(初回実行のため許容)"

      - name: 埋め込みを生成(差分のみ、1回の実行では上限件数まで)
        env:
          MAX_EMBEDS_PER_RUN: ${{ vars.MAX_EMBEDS_PER_RUN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL }}
          EMBED_DIM: ${{ vars.EMBED_DIM }}
          EMBED_SLEEP_SECONDS: ${{ vars.EMBED_SLEEP_SECONDS }}
        run: python scripts/build_embeddings.py --max-embeds "${MAX_EMBEDS_PER_RUN:-20}"

      - name: 重複・矛盾(superseded)を検知(今回新規/更新されたノートのみ対象)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_MODEL_CHAIN: ${{ vars.LLM_MODEL_CHAIN }}
          LLM_SLEEP_SECONDS: ${{ vars.LLM_SLEEP_SECONDS }}
        run: python scripts/detect_superseded.py

      - name: メタデータをindexへ再同期(status/shelf_lifeの最新値を反映)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL }}
          EMBED_DIM: ${{ vars.EMBED_DIM }}
        run: python scripts/build_embeddings.py --metadata-only

      - name: superseded分をcommit・push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A -- library/
          if git diff --cached --quiet; then
            echo "supersededによる変更なし"
            exit 0
          fi
          git commit -m "detect_superseded: 重複・矛盾ノートにsuperseded付与 ($(date -u +%Y-%m-%d))"
          for wait in 2 4 8 16 0; do
            if git push origin main; then
              exit 0
            fi
            [ "$wait" = "0" ] && break
            sleep "$wait"
            if ! git -c merge.directoryRenames=false pull --rebase origin main; then
              git rebase --abort
              break
            fi
          done
          branch="bot-conflict-${GITHUB_RUN_ID}"
          echo "::error::main へのpushに失敗したため ${branch} へ退避しました。PRとして回収してください"
          git push origin "HEAD:refs/heads/${branch}"
          exit 1

      - name: 埋め込みindexをReleaseアセットとして公開
        # 前段いずれかのcommit&pushが失敗した場合はジョブが停止しこのステップに到達しない
        # (= mainの更新に失敗した実行ではindexを公開しない。indexがmainより先に進まないようにするため)。
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view embeddings-index --repo mrkxlia/tsundoku >/dev/null 2>&1; then
            gh release create embeddings-index --repo mrkxlia/tsundoku \
              --title "embeddings-index" \
              --notes "tsundoku-site の /api/ask 用埋め込みindex(自動更新)"
          fi
          gh release upload embeddings-index index/embeddings.json \
            --repo mrkxlia/tsundoku --clobber

      - name: tsundoku-siteの再ビルドを起動(前回dispatch時から変更がある場合のみ)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: bash scripts/dispatch_site.sh
        # 前段2回のcommit&pushのいずれかが失敗した場合はこのステップに到達しない
        # (= mainの更新に失敗した実行ではdispatchしない)。
        # dispatch自体の要否(前回送信時からの変更有無)は scripts/dispatch_site.sh が判定する。
