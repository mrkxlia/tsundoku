name: Suggest similar sites

# 溜め込んだノートを埋め込みクラスタリングでトピック分けし、tsundoku-site の
# data/suggest/clusters.json を更新する(週次)。ユーザーがサイト上で「興味あり」に
# 登録したトピックに対する類似サイト調査(suggest_similar.py)は別PRで追加予定。
#
# クラスタリング自体は毎回再実行するが、前回centroidを初期値にする+新旧centroidの
# 類似度でIDを引き継ぐため、通常は構造が大きく動かない(scripts/cluster_notes.py参照)。

on:
  schedule:
    # 毎週月曜 20:00 UTC = 5:00 JST(organize.yml の 3:00 JST の後方)
    - cron: '0 20 * * 1'
  workflow_dispatch:
    inputs:
      recluster:
        description: '前回centroidを無視して完全に作り直す(ID照合は行う)'
        type: boolean
        default: false
      k:
        description: 'クラスタ数を固定する(空なら自動決定)'
        type: string
        default: ''

permissions:
  contents: read

# organize.yml(inbox整理)と同じVault checkoutを扱うため直列化する
concurrency:
  group: organize-inbox
  cancel-in-progress: false

jobs:
  suggest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # numpy はクラスタリング専用の依存。日次実行のorganize.ymlを重くしないため
          # requirements.txt には加えず、このワークフローでのみ追加インストールする。
          pip install numpy

      - name: 埋め込みindexをダウンロード(Releaseアセット、無ければ何もせず終了)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p index
          gh release download embeddings-index \
            --repo mrkxlia/tsundoku \
            --pattern embeddings.json \
            --dir index \
            --clobber \
            || echo "embeddings-index リリースが見つかりません(未生成のため今回はスキップ)"

      - name: tsundoku-site の data/suggest/ をcheckout(状態データの置き場)
        uses: actions/checkout@v4
        with:
          repository: mrkxlia/tsundoku-site
          token: ${{ secrets.SITE_CONTENT_TOKEN }}
          sparse-checkout: |
            data/suggest
          path: site-checkout

      - name: クラスタリングを実行
        if: hashFiles('index/embeddings.json') != ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_MODEL_CHAIN: ${{ vars.LLM_MODEL_CHAIN }}
          LLM_SLEEP_SECONDS: ${{ vars.LLM_SLEEP_SECONDS }}
          RECLUSTER: ${{ inputs.recluster }}
          CLUSTER_K: ${{ inputs.k }}
        run: |
          args=(--out site-checkout/data/suggest/clusters.json)
          if [ -f site-checkout/data/suggest/clusters.json ]; then
            args+=(--prev site-checkout/data/suggest/clusters.json)
          fi
          if [ "$RECLUSTER" = "true" ]; then
            args+=(--recluster)
          fi
          if [ -n "$CLUSTER_K" ]; then
            args+=(--k "$CLUSTER_K")
          fi
          python scripts/cluster_notes.py "${args[@]}"

      # TODO(Phase 2): 興味ありクラスタの類似サイト調査(scripts/suggest_similar.py)を
      # ここに追加する。suggestions.json / history.json の更新もそちらで行う。

      - name: tsundoku-siteへcommit・push(push自体がdeploy.ymlを起動する)
        working-directory: site-checkout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- data/suggest
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "suggest: トピッククラスタを更新 ($(date -u +%Y-%m-%d))"
          for wait in 2 4 8 16 0; do
            if git push origin main; then
              exit 0
            fi
            [ "$wait" = "0" ] && break
            sleep "$wait"
            if ! git pull --rebase origin main; then
              git rebase --abort
              break
            fi
          done
          echo "::error::tsundoku-site へのpushに失敗しました(次回実行で再試行されます)"
          exit 1
