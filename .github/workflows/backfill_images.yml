name: Backfill images (one-off)

# 注記(2026-08): assets/ は現在 .gitignore 対象で、実体は tsundoku-site の vault-assets/
# で管理している(organize.yml参照)。このワークフローは vault-assets/ との同期・書き戻し
# ステップを含んでいないため、実行しても assets/ への書き込みはpushされない。
# 再実行する場合は先に scripts/backfill_images.py の注記を確認すること。
on:
  workflow_dispatch:

permissions:
  contents: write

# organize.yml やモバイルからのpushと重ならないよう同じグループで並行実行を防止
concurrency:
  group: organize-inbox
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # デフォルト360分のハング課金事故を防止
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backfill
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_MODEL_CHAIN: ${{ vars.LLM_MODEL_CHAIN }}
          LLM_SLEEP_SECONDS: ${{ vars.LLM_SLEEP_SECONDS }}
        run: python scripts/backfill_images.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "backfill: 既存ノートへの画像取り込み ($(date -u +%Y-%m-%d))"
          for wait in 2 4 8 16 0; do
            if git push origin main; then
              exit 0
            fi
            [ "$wait" = "0" ] && break
            sleep "$wait"
            git -c merge.directoryRenames=false pull --rebase origin main
          done
          echo "pushに失敗しました" >&2
          exit 1
