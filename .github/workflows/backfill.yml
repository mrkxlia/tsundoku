name: Backfill

# 手動実行専用。初回埋め込みバックフィル(複数日かかる想定でレジューム前提)、メタデータのみの
# 一括再同期、shelf_life一括分類、superseded一括検知、発行日(published_at)一括取得に使う。
# organize.yml と同じconcurrency グループに参加し、通常実行やモバイルからのpushと
# 衝突しないようにする。
on:
  workflow_dispatch:
    inputs:
      task:
        description: "実行するタスク"
        required: true
        type: choice
        options:
          - embeddings
          - metadata-only
          - shelf_life
          - superseded
          - slides
          - published
        default: embeddings
      max_embeds:
        description: "このジョブで新規に処理する件数の上限(embeddings/shelf_life/slides/publishedタスクのみ有効)"
        required: false
        type: string
        default: "50"
      full:
        description: "変更検知を無視して全ノートを再埋め込みする(embeddingsタスクのみ有効)"
        required: false
        type: boolean
        default: false
      dispatch_site:
        description: "完了後に tsundoku-site の再ビルドを起動する(複数バッチ実行の途中はfalse推奨、最終バッチのみtrue)"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: organize-inbox
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180 # 実測2h09mの正当な長時間実行あり。巨大なmax_embedsを指定する場合は一時的に引き上げる
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: tsundoku-site の vault-assets/ をcheckout(embeddings/slidesタスクで既存アセット解決に必要)
        if: inputs.task == 'embeddings' || inputs.task == 'slides'
        uses: actions/checkout@v4
        with:
          repository: mrkxlia/tsundoku-site
          token: ${{ secrets.SITE_CONTENT_TOKEN }}
          sparse-checkout: |
            vault-assets
          path: site-assets-checkout

      - name: vault-assets/ を assets/ へ同期
        if: inputs.task == 'embeddings' || inputs.task == 'slides'
        run: |
          mkdir -p assets
          rsync -a --exclude 'README.md' site-assets-checkout/vault-assets/ assets/

      - name: スライド実体を取得(slidesタスクのみ)
        if: inputs.task == 'slides'
        env:
          INPUT_MAX_EMBEDS: ${{ inputs.max_embeds }}
        run: python scripts/fetch_slides.py --max-items "$INPUT_MAX_EMBEDS"

      - name: 新規アセットをtsundoku-siteへcommit・push(slidesタスクのみ)
        # vaultノートのcommitより先にこちらを成功させる(順序が重要、organize.ymlと同じ理由)。
        if: inputs.task == 'slides'
        working-directory: site-assets-checkout
        run: |
          rsync -a --ignore-existing ../assets/ vault-assets/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- vault-assets/
          if git diff --cached --quiet; then
            echo "新規アセットなし"
            exit 0
          fi
          git commit -m "assets: 新規スライド/画像アセットを追加 ($(date -u +%Y-%m-%d))"
          for wait in 2 4 8 0; do
            if git push origin main; then
              exit 0
            fi
            [ "$wait" = "0" ] && break
            sleep "$wait"
            if ! git pull --rebase origin main; then
              git rebase --abort
              break
            fi
          done
          echo "::error::tsundoku-site の vault-assets/ へのpushに失敗しました。今回のvault側commitは中断します(次回実行で再試行されます)"
          exit 1

      - name: 前回の埋め込みindexをダウンロード(Releaseアセット、初回は無くて良い)
        # publishedタスクは埋め込みindexに触れない(published_atはRAG検索対象外のため)
        if: inputs.task != 'published'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p index
          gh release download embeddings-index \
            --repo mrkxlia/tsundoku \
            --pattern embeddings.json \
            --dir index \
            --clobber \
            || echo "embeddings-index リリースが見つかりません(初回実行のため許容)"

      - name: build_embeddings.py を実行(embeddings/metadata-onlyタスクのみ)
        if: inputs.task == 'embeddings' || inputs.task == 'metadata-only'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL }}
          EMBED_DIM: ${{ vars.EMBED_DIM }}
          EMBED_SLEEP_SECONDS: ${{ vars.EMBED_SLEEP_SECONDS }}
          # workflow_dispatch入力は書き込み権限者のみ設定できるが、シェルへの直接展開(${{ }})は
          # 引用符を含む値でコマンドインジェクションになり得るため、env経由で安全に渡す。
          INPUT_TASK: ${{ inputs.task }}
          INPUT_MAX_EMBEDS: ${{ inputs.max_embeds }}
          INPUT_FULL: ${{ inputs.full }}
        run: |
          args=()
          if [ "$INPUT_TASK" = "metadata-only" ]; then
            args+=(--metadata-only)
          else
            args+=(--max-embeds "$INPUT_MAX_EMBEDS")
            if [ "$INPUT_FULL" = "true" ]; then
              args+=(--full)
            fi
          fi
          python scripts/build_embeddings.py "${args[@]}"

      - name: backfill_shelf_life.py を実行(shelf_lifeタスクのみ)
        if: inputs.task == 'shelf_life'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_MODEL_CHAIN: ${{ vars.LLM_MODEL_CHAIN }}
          LLM_LIGHT_MODEL_CHAIN: ${{ vars.LLM_LIGHT_MODEL_CHAIN }}
          LLM_SLEEP_SECONDS: ${{ vars.LLM_SLEEP_SECONDS }}
          LLM_SLEEP_OVERRIDES: ${{ vars.LLM_SLEEP_OVERRIDES }}
          INPUT_MAX_EMBEDS: ${{ inputs.max_embeds }}
        run: python scripts/backfill_shelf_life.py --max-items "$INPUT_MAX_EMBEDS"

      - name: backfill_published.py を実行(publishedタスクのみ。LLM・secrets不要)
        if: inputs.task == 'published'
        env:
          INPUT_MAX_EMBEDS: ${{ inputs.max_embeds }}
        run: python scripts/backfill_published.py --max-items "$INPUT_MAX_EMBEDS" --sleep 1

      - name: detect_superseded.py を実行(supersededタスクのみ、全ノート対象)
        if: inputs.task == 'superseded'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_MODEL_CHAIN: ${{ vars.LLM_MODEL_CHAIN }}
          LLM_LIGHT_MODEL_CHAIN: ${{ vars.LLM_LIGHT_MODEL_CHAIN }}
          LLM_SLEEP_SECONDS: ${{ vars.LLM_SLEEP_SECONDS }}
          LLM_SLEEP_OVERRIDES: ${{ vars.LLM_SLEEP_OVERRIDES }}
        run: python scripts/detect_superseded.py --all

      - name: frontmatterの変更をcommit・push(shelf_life/superseded/slides/publishedタスクのみ)
        if: inputs.task == 'shelf_life' || inputs.task == 'superseded' || inputs.task == 'slides' || inputs.task == 'published'
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TASK: ${{ inputs.task }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- library/
          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi
          git commit -m "backfill: ${INPUT_TASK} ($(date -u +%Y-%m-%d))"
          for wait in 2 4 8 16 0; do
            if git push origin main; then
              exit 0
            fi
            [ "$wait" = "0" ] && break
            sleep "$wait"
            if ! git -c merge.directoryRenames=false pull --rebase origin main; then
              git rebase --abort
              break
            fi
          done
          branch="bot-conflict-${GITHUB_RUN_ID}"
          echo "::error::main へのpushに失敗したため ${branch} へ退避しました。PRとして回収してください"
          git push origin "HEAD:refs/heads/${branch}"
          exit 1

      - name: メタデータをindexへ再同期(shelf_life/supersededタスクのみ)
        if: inputs.task == 'shelf_life' || inputs.task == 'superseded'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL }}
          EMBED_DIM: ${{ vars.EMBED_DIM }}
        run: python scripts/build_embeddings.py --metadata-only

      - name: 埋め込みindexをReleaseアセットとして公開
        # publishedタスクはindexをダウンロードも更新もしないため対象外
        if: inputs.task != 'published'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view embeddings-index --repo mrkxlia/tsundoku >/dev/null 2>&1; then
            gh release create embeddings-index --repo mrkxlia/tsundoku \
              --title "embeddings-index" \
              --notes "tsundoku-site の /api/ask 用埋め込みindex(自動更新)"
          fi
          gh release upload embeddings-index index/embeddings.json \
            --repo mrkxlia/tsundoku --clobber

      - name: tsundoku-siteの再ビルドを起動(dispatch_site=true かつ 前回dispatch時から変更がある場合のみ)
        if: inputs.dispatch_site
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: bash scripts/dispatch_site.sh
        # dispatch_site=false の場合、状態も更新されない。最終バッチ(または翌日のorganize)が
        # 累積した変更をまとめて検知し、1回だけdispatchする。
